[project]
name = "customerpulse"
version = "0.1.0"
description = "CustomerPulse: RFM segmentation, behavioural churn prediction, SHAP explainability and retention scenarios"
authors = [
    { name = "Parammeet", email = "parammeet92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
analysis = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.54.1",
]

[project.scripts]
customerpulse = "customerpulse.cli:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["db: tests that need a PostgreSQL database (CUSTOMERPULSE_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B017"]
"alembic/*" = ["I"]

[tool.mypy]
python_version = "3.12"
files = ["src/customerpulse"]
ignore_missing_imports = true
warn_unused_ignores = true
